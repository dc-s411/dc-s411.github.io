<body>
    <div class="head">
        <a href="./wr.html" style="color: rgb(237, 181, 8);font-size: 40px;font-family: 'SongTi';font-weight: bold">新湾铁路</a>
        <a href="./index.html" style="font-size:20px;position:absolute;right:32px;top:24px">主页</a>
    </div>
    <div class="main">
        <p style="font-size: 32px;position: relative;left: 128px;">湾铁河湾商务区车厂</p>
        <img src="./sources/rbc_depot.png" class="main-img">
        <p style="font-size: 20px;position: relative;left: 128px;width: 1024px;top: 548px;">湾铁河湾商务区车厂为新湾铁路一号线主要车厂，四条侧线配备A-train，K-train，IKK-train</p>
        <h2 style="position: relative;left: 128px;width: 1024px;top: 570px;">历史</h2>
        <p style="font-size: 20px;position: relative;left: 128px;width: 1024px;top: 572px;">新湾铁路，始于2024年第一代城市-邓城，原名邓城轨道交通。随着存档更新换代，铁路公司同时也在发展</p>
        <p style="font-size: 20px;position: relative;left: 128px;width: 1024px;top: 574px;">未改名前，我们的列车基本为进口，不存在自己制造的列车</p>
        <p style="font-size: 20px;position: relative;left: 128px;width: 1024px;top: 576px;">存档进入第三代后，城市改名为新湾，铁路公司同步改名，成为现在名字。铁路设备逐渐由进口转向自产</p>
